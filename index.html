<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Student Task Manager</h1>
      <p>Keep track of your assignments, exams, and deadlines.</p>
    </header>

    <!-- Task Statistics -->
    <div class="stats-bar">
      <div class="stat-card">Total: <span id="total-count">0</span></div>
      <div class="stat-card">Pending: <span id="pending-count">0</span></div>
      <div class="stat-card">Completed: <span id="completed-count">0</span></div>
    </div>

    <!-- Task Form -->
    <form id="task-form" class="task-form">
      <input type="text" id="task-title" placeholder="Assignment or task title..." required />
      <input type="text" id="task-subject" placeholder="Subject (e.g. Physics, History)" required />
      <input type="date" id="task-date" required />
      <select id="task-priority">
        <option value="Low">Low Priority</option>
        <option value="Medium" selected>Medium Priority</option>
        <option value="High">High Priority</option>
      </select>
      <button type="submit">Add Task</button>
    </form>

    <!-- Filters -->
    <div class="filters">
      <label for="filter-status">Filter Tasks:</label>
      <select id="filter-status">
        <option value="all">All Tasks</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <!-- Task List Container -->
    <ul id="task-list" class="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
